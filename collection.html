<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Travel collection by Aria Guo"><title>Collection — Aria Guo</title><link rel="stylesheet" href="./styles.css?v=7"><link rel="stylesheet" href="./tibet-gallery.css?v=1"><style>
.collection-gallery img{cursor:zoom-in;transition:filter .25s ease,transform .25s ease}.collection-gallery img:hover{filter:saturate(1.08) contrast(1.03);transform:translateY(-2px)}body.lightbox-open{overflow:hidden}
#travel-lightbox[hidden]{display:none}#travel-lightbox{position:fixed;inset:0;z-index:9999;display:grid;grid-template-columns:76px minmax(0,1fr) 76px;align-items:center;gap:18px;padding:30px;background:radial-gradient(circle at 50% 42%,rgba(38,34,29,.78),rgba(8,8,8,.97) 72%);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);animation:lightbox-in .28s ease both}
.lightbox-stage{margin:0;min-width:0;text-align:center}.lightbox-stage img{display:block;max-width:100%;width:auto;max-height:80vh;margin:auto;object-fit:contain;border-radius:3px;box-shadow:0 28px 90px rgba(0,0,0,.58);animation:photo-in .3s ease both}
.lightbox-caption{display:flex;justify-content:space-between;gap:24px;max-width:1100px;margin:14px auto 0;color:#eee7dc;font:500 11px/1.5 Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}.lightbox-caption span:first-child{text-align:left}.lightbox-count{white-space:nowrap;color:#bfb6a8}
.lightbox-nav,.lightbox-close{border:1px solid rgba(255,255,255,.28);background:rgba(18,18,18,.44);color:#f7f1e7;cursor:pointer;transition:background .2s ease,border-color .2s ease,transform .2s ease}.lightbox-nav{width:58px;height:58px;border-radius:50%;font:300 31px/1 Georgia,serif}.lightbox-nav:hover,.lightbox-nav:focus-visible,.lightbox-close:hover,.lightbox-close:focus-visible{background:#f3eee5;color:#181715;border-color:#f3eee5;outline:none;transform:scale(1.04)}.lightbox-nav:disabled{opacity:.22;cursor:default;transform:none}
.lightbox-close{position:absolute;right:24px;top:22px;width:44px;height:44px;border-radius:50%;font:300 25px/1 Arial,sans-serif}
.lightbox-end{position:absolute;left:50%;bottom:22px;transform:translate(-50%,8px);margin:0;color:#f2eadd;font:italic 17px/1.4 Georgia,serif;letter-spacing:.02em;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease}.is-last .lightbox-end{opacity:1;transform:translate(-50%,0)}.lightbox-end.pulse{animation:end-pulse .45s ease}
@keyframes lightbox-in{from{opacity:0}to{opacity:1}}@keyframes photo-in{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}@keyframes end-pulse{50%{color:#fff;transform:translate(-50%,-3px)}}
@media(max-width:720px){#travel-lightbox{grid-template-columns:48px minmax(0,1fr) 48px;gap:7px;padding:60px 10px 72px}.lightbox-nav{width:44px;height:44px;font-size:25px}.lightbox-stage img{max-height:72vh}.lightbox-caption{font-size:9px;gap:12px}.lightbox-close{right:13px;top:12px}.lightbox-end{bottom:18px;width:80%;text-align:center;font-size:15px}}
@media(prefers-reduced-motion:reduce){#travel-lightbox,.lightbox-stage img,.lightbox-end{animation:none}.collection-gallery img{transition:none}}
</style></head><body class="collection-page">
<header class="site-header"><a class="wordmark" href="./index.html">ARIA GUO</a><nav><a href="./index.html#categories">All collections</a><a href="./about.html">About</a></nav></header>
<main><section class="collection-intro"><p class="kicker">Travel collection</p><h1 id="place-title">Place</h1><p id="place-description">A visual study of this place.</p></section><section class="collection-gallery" id="collection-gallery"></section><a class="collection-back" href="./index.html#categories"><span>Back to</span><strong>Travel collections</strong><span>↖</span></a></main>
<footer><a class="wordmark" href="./index.html">ARIA GUO</a><p>© <span id="year"></span></p><a href="./index.html">Selected work</a></footer><script src="./script.js?v=8"></script><script src="./tibet-gallery.js?v=2"></script><script src="./beijing-gallery.js?v=2"></script><script>
(function(){
  var gallery=document.getElementById('collection-gallery');
  if(!gallery)return;
  var overlay=document.createElement('div');
  overlay.id='travel-lightbox';
  overlay.hidden=true;
  overlay.setAttribute('role','dialog');
  overlay.setAttribute('aria-modal','true');
  overlay.setAttribute('aria-label','Photograph viewer');
  overlay.innerHTML='<button class="lightbox-close" type="button" aria-label="Close enlarged photograph">&times;</button><button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous photograph">&#8592;</button><figure class="lightbox-stage"><img alt=""><figcaption class="lightbox-caption"><span class="lightbox-title"></span><span class="lightbox-count"></span></figcaption></figure><button class="lightbox-nav lightbox-next" type="button" aria-label="Next photograph">&#8594;</button><p class="lightbox-end" role="status">This is the last photo. Press Esc or click outside to close.</p>';
  document.body.appendChild(overlay);
  var large=overlay.querySelector('.lightbox-stage img');
  var title=overlay.querySelector('.lightbox-title');
  var count=overlay.querySelector('.lightbox-count');
  var end=overlay.querySelector('.lightbox-end');
  var previous=overlay.querySelector('.lightbox-prev');
  var next=overlay.querySelector('.lightbox-next');
  var closer=overlay.querySelector('.lightbox-close');
  var current=0;
  var returnFocus=null;
  function photos(){return Array.prototype.slice.call(gallery.querySelectorAll('img'));}
  function render(){
    var list=photos();
    var item=list[current];
    if(!item)return;
    large.src=item.currentSrc||item.src;
    large.alt=item.alt||'Travel photograph';
    title.textContent=item.alt||'Untitled photograph';
    count.textContent=(current+1)+' / '+list.length;
    previous.disabled=current===0;
    var isLast=current===list.length-1;
    next.setAttribute('aria-disabled',String(isLast));
    overlay.classList.toggle('is-last',isLast);
  }
  function openAt(index){
    returnFocus=document.activeElement;
    current=index;
    render();
    overlay.hidden=false;
    document.body.classList.add('lightbox-open');
    closer.focus();
  }
  function closeViewer(){
    overlay.hidden=true;
    document.body.classList.remove('lightbox-open');
    large.removeAttribute('src');
    if(returnFocus&&returnFocus.focus)returnFocus.focus();
  }
  function move(step){
    var list=photos();
    if(step>0&&current===list.length-1){
      end.classList.remove('pulse');
      void end.offsetWidth;
      end.classList.add('pulse');
      return;
    }
    current=Math.max(0,Math.min(list.length-1,current+step));
    render();
  }
  gallery.addEventListener('click',function(event){
    var image=event.target.closest('img');
    if(!image||!gallery.contains(image))return;
    openAt(photos().indexOf(image));
  });
  previous.addEventListener('click',function(){move(-1);});
  next.addEventListener('click',function(){move(1);});
  closer.addEventListener('click',closeViewer);
  overlay.addEventListener('click',function(event){if(event.target===overlay)closeViewer();});
  document.addEventListener('keydown',function(event){
    if(overlay.hidden)return;
    if(event.key==='Escape')closeViewer();
    else if(event.key==='ArrowLeft')move(-1);
    else if(event.key==='ArrowRight')move(1);
    else if(event.key==='Home'){current=0;render();}
    else if(event.key==='End'){current=photos().length-1;render();}
  });
})();
</script></body></html>
